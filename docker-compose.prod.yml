# Consume la imagen publicada en GHCR: no construye nada, no necesita el código fuente.
# Única diferencia con docker-compose.yml: "image:" en vez de "build: .".
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gastos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gastos}
      POSTGRES_DB: ${POSTGRES_DB:-gastos}
    volumes:
      - gastos_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gastos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: ghcr.io/luiserpandrade-bot/proyecto-curso-speckit:latest
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-gastos}:${POSTGRES_PASSWORD:-gastos}@db:5432/${POSTGRES_DB:-gastos}
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    restart: "no"

  backend:
    image: ghcr.io/luiserpandrade-bot/proyecto-curso-speckit:latest
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-gastos}:${POSTGRES_PASSWORD:-gastos}@db:5432/${POSTGRES_DB:-gastos}
    restart: unless-stopped

volumes:
  gastos_db_data:
